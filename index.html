<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normas ESP — Legislação em Epidemiologia e Emergências em Saúde Pública</title>
    <meta name="description" content="Repositório interativo de Leis, Decretos, Portarias e Resoluções em Vigilância Epidemiológica e Gestão de Emergências em Saúde Pública.">
    <style>
        :root {
            /* Cores Padronizadas EPIC95 */
            --epic-primary: #4f8aac;     /* Azul Primário */
            --epic-secondary: #03658c;   /* Azul Petróleo */
            --epic-highlight: #02735e;   /* Verde Destaque */
            --epic-attention: #ffde59;   /* Amarelo Neutro/Atenção */
            
            --epic-black: #1E293B;
            --epic-white: #FFFFFF;
            --epic-gray-light: #F8FAFC;
            --epic-gray-mid: #E2E8F0;

            /* Mapeamento Semântico do Tema */
            --primary: var(--epic-primary);
            --secondary: var(--epic-secondary);
            --accent-bg: #eaf1f5; /* Light mix based on primary */
            --border: var(--epic-gray-mid);
            
            --highlight: var(--epic-attention); 
            --highlight-active: #ffe885; /* lighter yellow for active state */
            --highlight-ring: var(--epic-highlight); /* Green ring for focus */
            
            --text: var(--epic-black);
            --muted: #64748B;
            --bg: var(--epic-gray-light);
            --card: var(--epic-white);
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            line-height: 1.7;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
        }
        
        /* Cabeçalho Global */
        .global-topbar {
            background: linear-gradient(135deg, var(--secondary) 0%, #024B69 100%);
            color: var(--epic-white);
            padding: 16px 20px;
            border-bottom: 4px solid var(--epic-highlight);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        body.is-embed .global-topbar {
            display: none;
        }
        .brand-section {
            display: flex;
            flex-direction: column;
        }
        .brand-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }
        .brand-subtitle {
            margin: 2px 0 0 0;
            font-size: 13px;
            color: #b8dcec;
        }
        .global-actions {
            display: flex;
            gap: 10px;
        }
        .btn-home {
            background: var(--epic-attention);
            color: var(--secondary);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-home:hover {
            background: #f7d238;
            transform: translateY(-1px);
        }

        /* Dashboard Grid View */
        #dashboard-view {
            max-width: 1080px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .dash-title {
            font-size: 22px;
            color: var(--secondary);
            margin: 0;
        }
        .cat-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .cat-tab {
            background: var(--epic-white);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .cat-tab:hover {
            background: var(--accent-bg);
            border-color: var(--primary);
        }
        .cat-tab.active {
            background: var(--primary);
            color: var(--epic-white);
            border-color: var(--primary);
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .leg-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(3, 101, 140, 0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .leg-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(3, 101, 140, 0.1);
            border-color: var(--primary);
        }
        .lc-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .lc-badge {
            background: var(--epic-highlight);
            color: var(--epic-white);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .lc-number {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }
        .lc-apelido {
            font-size: 18px;
            font-weight: 700;
            color: var(--secondary);
            margin: 0 0 6px 0;
            line-height: 1.3;
        }
        .lc-title {
            font-size: 13px;
            color: var(--muted);
            margin: 0 0 16px 0;
        }
        .lc-ementa {
            font-size: 13.5px;
            color: var(--text);
            margin-bottom: 24px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }
        .lc-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }
        .btn-read {
            flex: 1;
            background: var(--primary);
            color: var(--epic-white);
            border: none;
            padding: 8px 0;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }
        .btn-read:hover {
            background: var(--secondary);
        }
        .btn-bibtex {
            flex: 1;
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 0;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .btn-bibtex:hover {
            background: var(--primary);
            color: var(--epic-white);
        }

        /* Reader View (Oculto inicialmente) */
        #reader-view {
            display: none;
        }
        
        .reader-toolbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1001;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .btn-back {
            background: var(--accent-bg);
            color: var(--secondary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-back:hover {
            background: var(--border);
        }

        /* Navegação por Termos */
        .terms-panel {
            background: var(--card);
            border-bottom: 2px solid var(--epic-attention);
            padding: 14px 20px;
            position: sticky;
            top: 50px; /* Below reader-toolbar */
            z-index: 1000;
        }
        .terms-panel-inner {
            max-width: 980px;
            margin: 0 auto;
        }
        .nav-label-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .legis-menu-title {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--secondary);
            text-transform: uppercase;
        }
        .search-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .custom-search {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            width: 200px;
        }
        .custom-search:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .match-nav {
            display: none;
            align-items: center;
            gap: 6px;
            background: var(--accent-bg);
            border: 1px solid var(--primary);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
        }
        .match-nav.visible {
            display: inline-flex;
        }
        .nav-arrow {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-arrow:hover {
            background: var(--secondary);
        }
        .clear-btn {
            background: var(--border);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .terms-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .term-btn {
            background: var(--card);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .term-btn:hover:not(.disabled) {
            background: var(--primary);
            color: var(--epic-white);
        }
        .term-btn.active-term {
            background: var(--epic-highlight);
            color: var(--epic-white);
            border-color: var(--epic-highlight);
        }
        .term-btn.disabled {
            border-color: var(--border);
            color: var(--muted);
            background: var(--bg);
            cursor: not-allowed;
        }

        /* Container da Norma */
        #legis-container {
            max-width: 920px;
            margin: 24px auto 48px auto;
            background: var(--card);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 12px rgba(3, 101, 140, 0.05);
        }
        
        .doc-banner {
            background: var(--accent-bg);
            border-left: 5px solid var(--primary);
            padding: 16px 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 24px;
        }
        .doc-banner-apelido {
            font-size: 22px;
            font-weight: 700;
            color: var(--secondary);
            margin: 0 0 4px 0;
        }
        .doc-banner-title {
            font-size: 14px;
            color: var(--text);
            margin: 0 0 12px 0;
        }
        
        /* Tipografia Jurídica */
        #legis-content h2.doc-official-title {
            color: var(--secondary);
            font-size: 20px;
            margin: 12px 0;
            text-align: center;
        }
        #legis-content h3 {
            color: var(--secondary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 6px;
            margin-top: 36px;
            font-size: 17px;
            scroll-margin-top: 140px;
        }
        #legis-content p {
            margin-bottom: 14px;
            text-align: justify;
        }
        #legis-content p.doc-meta {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        #legis-content p.doc-ementa {
            background: var(--bg);
            border-left: 4px solid var(--epic-attention);
            padding: 16px;
            color: var(--text);
            font-size: 14.5px;
            margin: 20px 0;
            border-radius: 0 6px 6px 0;
        }
        #legis-content p.artigo { margin-top: 20px; }
        #legis-content p.paragrafo, #legis-content p.inciso { margin-left: 24px; }
        #legis-content p.doc-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 14px;
            color: var(--muted);
            text-align: center;
        }
        
        /* Destaques */
        .highlighted-term {
            background-color: var(--epic-attention);
            font-weight: 700;
            color: var(--epic-black);
            padding: 1px 3px;
            border-radius: 3px;
        }
        .highlighted-active {
            background-color: var(--highlight-active);
            box-shadow: 0 0 0 2px var(--epic-highlight);
        }

        .editorial-footer {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        
        @media (max-width: 640px) {
            #legis-container { margin: 12px; padding: 20px; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Cabeçalho Global -->
    <div class="global-topbar">
        <div class="brand-section">
            <h1 class="brand-title">Normas ESP</h1>
            <p class="brand-subtitle">Epidemiologia e Gestão de Emergências em Saúde Pública</p>
        </div>
        <div class="global-actions">
            <button class="btn-home" onclick="showDashboard()">Catálogo</button>
        </div>
    </div>

    <!-- Visão 1: Dashboard (Grade de Leis) -->
    <div id="dashboard-view">
        <div class="dash-header">
            <h2 class="dash-title">Painel de Legislações</h2>
            <div class="cat-tabs" id="cat-tabs">
                <!-- Abas injetadas via JS -->
            </div>
        </div>
        <div class="dashboard-grid" id="dashboard-grid">
            <!-- Cards injetados via JS -->
        </div>
    </div>

    <!-- Visão 2: Leitor de Documento -->
    <div id="reader-view">
        <div class="reader-toolbar">
            <button class="btn-back" onclick="showDashboard()">&#8592; Voltar ao Painel</button>
            <div id="reader-export-container"></div>
        </div>
        
        <div class="terms-panel">
            <div class="terms-panel-inner">
                <div class="nav-label-row">
                    <span class="legis-menu-title">Exploração Rápida por Termos</span>
                    <div class="search-controls">
                        <input type="text" id="custom-search" class="custom-search" placeholder="Ex: quarentena, art 7..." />
                        <div id="match-nav" class="match-nav">
                            <button class="nav-arrow" id="prev-match">&#9664;</button>
                            <span id="match-counter">0/0</span>
                            <button class="nav-arrow" id="next-match">&#9654;</button>
                        </div>
                        <button class="clear-btn" id="clear-btn">Limpar</button>
                    </div>
                </div>
                <div class="terms-grid" id="terms-grid"></div>
            </div>
        </div>

        <main id="legis-container">
            <div class="doc-banner" id="doc-banner"></div>
            <article id="legis-content"></article>
        </main>
    </div>

    <footer class="editorial-footer">
        Wanderson Epidemiologista &bull; Cores Padronizadas EPIC95
    </footer>

    <!-- Carrega o catálogo de dados -->
    <script src="legislacoes.js"></script>

    <script>
        const CATALOGO = window.LEGISLACOES || [];

        const TERMOS_CHAVE = [
            { label: "Prevenir", root: "preven" }, { label: "Proteger", root: "prote" },
            { label: "Mitigar", root: "mitig" }, { label: "Preparar", root: "prepar" },
            { label: "Detectar", root: "detect" }, { label: "Verificar", root: "verific" },
            { label: "Notificar", root: "notific" }, { label: "Ativar", root: "ativ" },
            { label: "Responder", root: "respond" }, { label: "Controlar", root: "control" },
            { label: "Conter", root: "cont" }, { label: "Desativar", root: "desativ" },
            { label: "Desmobilizar", root: "desmobiliz" }, { label: "Recuperar", root: "recuper" },
            { label: "Aprender", root: "aprend" }, { label: "Risco", root: "risco" },
            { label: "Comunicação", root: "comunica" }, { label: "Lições aprendidas", root: "licoes aprendidas" },
            { label: "Emergências", root: "emergencia" }, { label: "Surtos", root: "surto" },
            { label: "Epidemias", root: "epidemia" }
        ];

        let categoriaFiltro = "Todas";
        let legislacaoAtivaId = null;
        let termoAtivo = "";
        let matches = [];
        let currentMatchIndex = -1;

        const removeAccents = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

        // ==========================================
        // EXPORTAÇÃO BIBTEX PARA ZOTERO
        // ==========================================
        function exportBibTeX(id) {
            const leg = CATALOGO.find(l => l.id === id);
            if (!leg) return;
            
            const citationKey = `${leg.tipo.toLowerCase()}${leg.numero ? leg.numero.replace(/\D/g,'') : ''}_${leg.data ? leg.data.split('-')[0] : 'ano'}`;
            const urldate = new Date().toISOString().split('T')[0];
            
            const bibtex = `@jurisdiction{${citationKey},
    title = {${leg.titulo}},
    shorttitle = {${leg.apelido || leg.titulo}},
    number = {${leg.numero || ''}},
    institution = {${leg.orgao || 'Governo Federal do Brasil'}},
    date = {${leg.data || ''}},
    url = {${leg.fonteUrl || ''}},
    urldate = {${urldate}},
    abstract = {${leg.ementa || ''}},
    type = {Legislação},
    language = {pt-BR}
}`;
            
            const blob = new Blob([bibtex], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${citationKey}.bib`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ==========================================
        // VISÃO DASHBOARD
        // ==========================================
        function initDashboard() {
            renderDashboardTabs();
            renderDashboardGrid();
        }

        function renderDashboardTabs() {
            const container = document.getElementById("cat-tabs");
            container.innerHTML = "";
            const tipos = ["Todas", ...new Set(CATALOGO.map(l => l.tipo))];
            
            tipos.forEach(cat => {
                const count = cat === "Todas" ? CATALOGO.length : CATALOGO.filter(l => l.tipo === cat).length;
                const btn = document.createElement("button");
                btn.className = "cat-tab" + (categoriaFiltro === cat ? " active" : "");
                btn.textContent = `${cat === "Lei" ? "Leis" : cat + "s"} (${count})`;
                btn.onclick = () => {
                    categoriaFiltro = cat;
                    renderDashboardTabs();
                    renderDashboardGrid();
                };
                container.appendChild(btn);
            });
        }

        function renderDashboardGrid() {
            const grid = document.getElementById("dashboard-grid");
            grid.innerHTML = "";
            const filtradas = categoriaFiltro === "Todas" ? CATALOGO : CATALOGO.filter(l => l.tipo === categoriaFiltro);
            
            filtradas.forEach(leg => {
                grid.innerHTML += `
                    <div class="leg-card">
                        <div class="lc-meta">
                            <span class="lc-badge">${leg.tipo}</span>
                            <span class="lc-number">Nº ${leg.numero || 'S/N'}</span>
                        </div>
                        <h3 class="lc-apelido">${leg.apelido || leg.titulo}</h3>
                        <p class="lc-title">${leg.titulo}</p>
                        <p class="lc-ementa" title="${leg.ementa}">${leg.ementa}</p>
                        <div class="lc-actions">
                            <button class="btn-read" onclick="showReader('${leg.id}')">Ler Norma</button>
                            <button class="btn-bibtex" onclick="exportBibTeX('${leg.id}')">Zotero (BibTeX)</button>
                        </div>
                    </div>
                `;
            });
        }

        function showDashboard() {
            document.getElementById("reader-view").style.display = "none";
            document.getElementById("dashboard-view").style.display = "block";
            legislacaoAtivaId = null;
            clearHighlights();
        }

        // ==========================================
        // VISÃO LEITOR (NORMA)
        // ==========================================
        function showReader(id) {
            legislacaoAtivaId = id;
            document.getElementById("dashboard-view").style.display = "none";
            document.getElementById("reader-view").style.display = "block";
            
            const leg = CATALOGO.find(l => l.id === id);
            
            // Setup Toolbar Export
            document.getElementById("reader-export-container").innerHTML = `
                <button class="btn-bibtex" style="padding: 6px 12px; margin:0;" onclick="exportBibTeX('${leg.id}')">Citar no Zotero</button>
            `;
            
            // Setup Banner
            document.getElementById("doc-banner").innerHTML = `
                <h2 class="doc-banner-apelido">${leg.apelido || leg.titulo}</h2>
                <p class="doc-banner-title">${leg.titulo} &bull; ${leg.data ? leg.data.split('-')[0] : ''}</p>
                <a href="${leg.fonteUrl}" target="_blank" style="color:var(--primary); font-size:13px; font-weight:600;">Link Oficial &#8599;</a>
            `;
            
            // Inject Content
            document.getElementById("legis-content").innerHTML = leg.conteudoHtml;
            
            renderTermButtons(leg);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderTermButtons(activeLeg) {
            const grid = document.getElementById("terms-grid");
            grid.innerHTML = "";
            
            const tmp = document.createElement("div");
            tmp.innerHTML = activeLeg.conteudoHtml;
            const activeText = removeAccents(tmp.textContent || "").toLowerCase();

            TERMOS_CHAVE.forEach(item => {
                const escapedRoot = item.root.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escapedRoot, "g");
                const found = activeText.match(regex);
                const countHere = found ? found.length : 0;

                const btn = document.createElement("button");
                btn.className = "term-btn";

                if (countHere > 0) {
                    btn.textContent = `${item.label} (${countHere})`;
                    if (termoAtivo === item.root) btn.classList.add("active-term");
                    btn.onclick = () => {
                        termoAtivo = item.root;
                        document.getElementById("custom-search").value = "";
                        renderTermButtons(activeLeg);
                        applyHighlight(item.root);
                    };
                } else {
                    btn.classList.add("disabled");
                    btn.disabled = true;
                    btn.textContent = item.label;
                }
                grid.appendChild(btn);
            });
        }

        // ==========================================
        // MOTOR DE BUSCA E HIGHLIGHT
        // ==========================================
        function clearHighlights() {
            const contentDiv = document.getElementById("legis-content");
            const prev = contentDiv.querySelectorAll(".highlighted-term");
            prev.forEach(el => {
                const parent = el.parentNode;
                parent.replaceChild(document.createTextNode(el.textContent), el);
                parent.normalize();
            });
            matches = [];
            currentMatchIndex = -1;
            updateMatchNav();
        }

        function applyHighlight(searchRoot) {
            clearHighlights();
            if (!searchRoot) return;

            const contentDiv = document.getElementById("legis-content");
            const walker = document.createTreeWalker(contentDiv, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let node;
            while ((node = walker.nextNode())) {
                if (node.parentNode.nodeName !== "SCRIPT" && node.parentNode.nodeName !== "STYLE") {
                    textNodes.push(node);
                }
            }

            const normSearch = removeAccents(searchRoot).toLowerCase();

            textNodes.forEach(textNode => {
                const text = textNode.nodeValue;
                const normText = removeAccents(text).toLowerCase();
                let index = normText.indexOf(normSearch);

                if (index !== -1) {
                    const parent = textNode.parentNode;
                    let lastIndex = 0;
                    const fragment = document.createDocumentFragment();

                    while (index !== -1) {
                        let endIndex = index + normSearch.length;
                        while (endIndex < text.length && /[a-zA-ZÀ-ÿ0-9]/.test(text[endIndex])) {
                            endIndex++;
                        }

                        fragment.appendChild(document.createTextNode(text.substring(lastIndex, index)));

                        const span = document.createElement("span");
                        span.className = "highlighted-term";
                        span.textContent = text.substring(index, endIndex);
                        fragment.appendChild(span);
                        matches.push(span);

                        lastIndex = endIndex;
                        index = normText.indexOf(normSearch, lastIndex);
                    }
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                    parent.replaceChild(fragment, textNode);
                }
            });

            if (matches.length > 0) {
                currentMatchIndex = 0;
                focusMatch(0);
            }
            updateMatchNav();
        }

        function focusMatch(idx) {
            matches.forEach(m => m.classList.remove("highlighted-active"));
            if (idx >= 0 && idx < matches.length) {
                currentMatchIndex = idx;
                const el = matches[idx];
                el.classList.add("highlighted-active");
                el.scrollIntoView({ behavior: "smooth", block: "center" });
                updateMatchNav();
            }
        }

        function updateMatchNav() {
            const nav = document.getElementById("match-nav");
            const counter = document.getElementById("match-counter");
            if (matches.length > 0) {
                nav.classList.add("visible");
                counter.textContent = `${currentMatchIndex + 1}/${matches.length}`;
            } else {
                nav.classList.remove("visible");
            }
        }

        document.getElementById("prev-match").onclick = () => focusMatch((currentMatchIndex - 1 + matches.length) % matches.length);
        document.getElementById("next-match").onclick = () => focusMatch((currentMatchIndex + 1) % matches.length);
        document.getElementById("clear-btn").onclick = () => {
            termoAtivo = "";
            document.getElementById("custom-search").value = "";
            clearHighlights();
            if (legislacaoAtivaId) renderTermButtons(CATALOGO.find(l => l.id === legislacaoAtivaId));
        };
        
        document.getElementById("custom-search").addEventListener("input", (e) => {
            const val = e.target.value.trim();
            termoAtivo = "";
            if (legislacaoAtivaId) renderTermButtons(CATALOGO.find(l => l.id === legislacaoAtivaId));
            val.length >= 2 ? applyHighlight(val) : clearHighlights();
        });

        // Initialize App
        if (new URLSearchParams(window.location.search).get("embed") === "1") {
            document.body.classList.add("is-embed");
        }
        initDashboard();
    </script>
</body>
</html>
